name: Sync GE6 votes
on:
  schedule:
    - cron: '2-59/5 * * * *'
    - cron: '1,11,31 5 30,31 10 *'
  workflow_dispatch:
concurrency:
  group: sync-ge6
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sync (skipped until Turso secrets are set)
        run: if [ -z "$TURSO_DATABASE_URL" ]; then echo "TURSO_DATABASE_URL secret is not set"; else pnpm sync; fi
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      - name: Holder balances snapshot (GE6 every run, BNK every 30 minutes)
        if: always()
        run: if [ -z "$TURSO_DATABASE_URL" ]; then echo "TURSO_DATABASE_URL secret is not set"; else pnpm sync:holders; fi
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      - name: Save preliminary 2 transaction and forecast snapshots
        if: success()
        run: |
          if [ -z "$TURSO_DATABASE_URL" ]; then exit 0; fi
          now=$(date -u +%s)
          friday=$(date -u -d '2026-10-30 05:00:00' +%s)
          saturday=$(date -u -d '2026-10-31 05:00:00' +%s)
          end=$(date -u -d '2026-11-03 05:00:00' +%s)
          if [ "$now" -ge "$friday" ] && [ "$now" -lt "$end" ]; then node scripts/snapshot-ge6.mjs 2026-10-30; fi
          if [ "$now" -ge "$saturday" ] && [ "$now" -lt "$end" ]; then node scripts/snapshot-ge6.mjs 2026-10-31; fi
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
  chain-backup:
    if: github.event.schedule == '1,11,31 5 30,31 10 *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        day: ['2026-10-30','2026-10-31']
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Save chain transactions without Turso
        shell: bash
        run: |
          cutoff=$(date -u -d '${{ matrix.day }} 05:00:00' +%s)
          if [ "$(date -u +%s)" -lt "$cutoff" ]; then exit 0; fi
          node scripts/backup-ge6-chain.mjs '${{ matrix.day }}'
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ge6-chain-${{ matrix.day }}
          path: snapshot-backup/ge6-transactions-${{ matrix.day }}.json
          if-no-files-found: ignore
